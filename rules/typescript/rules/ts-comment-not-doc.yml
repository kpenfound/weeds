id: ts-comment-not-doc
language: TypeScript
severity: hint
message: comment is not a doc comment on an exported identifier
rule:
  all:
    - matches: ts-plain-comment
    - any:
        - matches: ts-in-function
        - regex: '^.*ast_grep_ignore'
        - not:
            matches: ts-jsdoc
        - not:
            precedes:
              stopBy:
                not:
                  kind: comment
              matches: ts-doc-target
