id: go-comment-not-doc
language: Go
severity: hint
message: comment is not a doc comment on an exported identifier
rule:
  all:
    - matches: go-plain-comment
    - any:
        - matches: go-in-function
        - regex: '^.*ast_grep_ignore'
        - not:
            precedes:
              stopBy:
                not:
                  kind: comment
              matches: go-doc-target
