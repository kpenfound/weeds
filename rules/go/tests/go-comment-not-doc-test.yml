invalid:
  - |
    package p

    // run starts the work.
    func run() {}
  - |
    package p

    func Run() {
    	// body
    	x := 1
    	_ = x
    }
  - |
    package p

    var f = func() {
    	// closure
    }
  - |
    package p

    func Run() {
    	// Local is declared in a function.
    	type Local struct {
    		// Field is exported.
    		Field int
    	}
    }
  - |
    package p

    // stray comment at the end
  - |
    package p

    type T struct {
    	// b is unexported.
    	b int
    }
  - |
    package p

    const (
    	// c is unexported.
    	c = 1
    )
  - |
    package p

    // not a directive, no colon
    //gox:thing
    func a() {}
  - |
    package p

    // T is exported.
    type T struct {
    	c int // trailing is judged elsewhere
    }
  - |
    package p

    type i interface {
    	// M is a method of an unexported interface.
    	M()
    }
  - |
    package p

    /* header */
    import "fmt"
