id: go-comment-main
valid:
  - |
    package p

    // Run starts the work.
    func Run() {}
  - |
    package main

    //go:embed data.txt
    var data string
  - |
    package main

    func main() {}
  - |
    package p
    //weeds-nl

    //weeds-nl
    // Run starts the work.
    //weeds-nl
    func Run() {}
