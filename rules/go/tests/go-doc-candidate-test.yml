id: go-doc-candidate
valid:
  - |
    package p

    // run starts the work.
    func run() {}
  - |
    package p

    func Run() {
    	// body
    }
  - |
    package p

    //go:build linux
    func Run() {}
  - |
    package p

    func Run() {
    	// Local is declared in a function.
    	type Local int
    }
  - |
    package p

    // stray comment at the end
invalid:
  - |
    // Package p does things.
    package p
  - |
    package p

    // Run starts the work.
    func Run() {}
  - |
    package p

    // Run starts the work.
    //
    //go:noinline
    func Run() {}
  - |
    package p

    // T is a type.
    type T struct{}
  - |
    package p

    type T struct {
    	// A is a field.
    	A int
    }
  - |
    package p

    type (
    	// X is a type.
    	X int
    )
  - |
    package p

    const (
    	// C is a constant.
    	C = 1
    )
  - |
    package p

    // V holds values.
    var (
    	v = 1
    	W = 2
    )
  - |
    package p

    type I interface {
    	// M does it.
    	M()
    }
  - |
    package p

    // Do runs the method.
    func (t T) Do() {}
  - |
    package p

    // A is an alias.
    type A = int
  - |
    package p

    // N is a number.
    var N = 1
